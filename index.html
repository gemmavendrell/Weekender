<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organitzador de Caps de Setmana</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f3f0ea;
      color: #202522;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app {
      margin: 0 auto;
      max-width: 980px;
      min-height: 100vh;
      padding: 18px 18px 28px;
    }

    header {
      align-items: center;
      display: flex;
      gap: 14px;
      justify-content: space-between;
      margin-bottom: 18px;
      position: relative;
      z-index: 10;
    }

    .brand h1 {
      font-size: 28px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .brand p {
      color: #68716b;
      font-size: 14px;
      font-weight: 700;
      margin-top: 5px;
    }

    .tabs {
      background: #ffffff;
      border: 1px solid #ded8cd;
      border-radius: 8px;
      display: flex;
      gap: 4px;
      padding: 4px;
      flex-shrink: 0;
    }

    .tab {
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: #59625d;
      cursor: pointer;
      font-size: 14px;
      font-weight: 900;
      min-height: 38px;
      padding: 0 14px;
      touch-action: manipulation;
    }

    .tab.active {
      background: #203a34;
      color: #ffffff;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .next-event {
      background: #203a34;
      border-radius: 8px;
      color: #ffffff;
      margin-bottom: 18px;
      min-height: 150px;
      padding: 22px;
      width: 100%;
    }

    .next-event .label {
      color: #b8d7c9;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .next-event h2 {
      font-size: 29px;
      line-height: 1.15;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .next-event p {
      color: #e7eee9;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .summary-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 18px;
    }

    .summary-box {
      background: #ffffff;
      border: 1px solid #ded8cd;
      border-radius: 8px;
      padding: 16px;
    }

    .summary-box strong {
      display: block;
      font-size: 24px;
      margin-bottom: 6px;
    }

    .summary-box span {
      color: #68716b;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #ded8cd;
      border-radius: 8px;
      padding: 18px;
    }

    .panel h2 {
      font-size: 21px;
      margin-bottom: 14px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, 1fr);
    }

    label {
      color: #4a544f;
      display: grid;
      font-size: 13px;
      font-weight: 900;
      gap: 7px;
    }

    input,
    select {
      background: #fbfaf7;
      border: 1px solid #cfc8bc;
      border-radius: 8px;
      color: #202522;
      font-size: 16px;
      min-height: 46px;
      padding: 0 12px;
      width: 100%;
    }

    .full {
      grid-column: 1 / -1;
    }

    .primary-button {
      background: #d95f3d;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 16px;
      font-weight: 900;
      min-height: 50px;
      padding: 0 18px;
      touch-action: manipulation;
      width: 100%;
    }

    .calendar-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, 1fr);
    }

    .day-column {
      background: #ffffff;
      border: 1px solid #ded8cd;
      border-radius: 8px;
      min-height: 360px;
      padding: 16px;
    }

    .day-column h2 {
      align-items: center;
      display: flex;
      font-size: 22px;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .count {
      background: #eef4ef;
      border-radius: 8px;
      color: #203a34;
      font-size: 13px;
      font-weight: 900;
      padding: 7px 9px;
    }

    .event-list {
      display: grid;
      gap: 10px;
    }

    .event-card {
      background: #f8f6f1;
      border: 1px solid #e2dbd0;
      border-left: 5px solid #203a34;
      border-radius: 8px;
      padding: 13px;
    }

    .event-top {
      align-items: flex-start;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .event-title {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .event-time {
      color: #d95f3d;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .event-detail {
      color: #5d665f;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed #cfc8bc;
      border-radius: 8px;
      color: #777067;
      font-size: 15px;
      font-weight: 700;
      padding: 18px;
      text-align: center;
    }

    .delete-button {
      background: transparent;
      border: 0;
      color: #8a3022;
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
      margin-top: 10px;
      padding: 0;
      min-height: 34px;
      touch-action: manipulation;
    }

    @media (max-width: 720px) {
      body {
        background: #ffffff;
      }

      .app {
        padding: 14px 14px 88px;
      }

      header {
        align-items: stretch;
        background: #ffffff;
        border-bottom: 1px solid #ebe5da;
        flex-direction: column;
        gap: 12px;
        margin: -14px -14px 16px;
        padding: 14px;
        position: sticky;
        top: 0;
      }

      .brand h1 {
        font-size: 25px;
      }

      .tabs {
        border-radius: 8px;
        width: 100%;
      }

      .tab {
        flex: 1;
        font-size: 15px;
        min-height: 44px;
      }

      .summary-grid,
      .calendar-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .next-event {
        border-radius: 8px;
        margin-bottom: 14px;
        min-height: 138px;
        padding: 18px;
      }

      .next-event h2 {
        font-size: 25px;
      }

      .summary-grid {
        gap: 10px;
      }

      .summary-box {
        align-items: center;
        display: flex;
        justify-content: space-between;
        min-height: 64px;
        padding: 14px;
      }

      .summary-box strong {
        margin-bottom: 0;
      }

      .panel,
      .day-column {
        border-left: 0;
        border-radius: 8px;
        border-right: 0;
        margin-left: -2px;
        margin-right: -2px;
        padding: 16px;
      }

      input,
      select {
        font-size: 16px;
        min-height: 50px;
      }

      .event-top {
        align-items: stretch;
        flex-direction: column;
        gap: 4px;
      }

      .event-time {
        white-space: normal;
      }
    }

    @media (max-width: 380px) {
      .brand h1 {
        font-size: 23px;
      }

      .next-event h2 {
        font-size: 23px;
      }

      .tab {
        padding: 0 8px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <h1>El meu cap de setmana</h1>
        <p>Organitza els dissabtes i diumenges</p>
      </div>

      <nav class="tabs" aria-label="Pàgines">
        <button class="tab active" type="button" data-page="home">Inici</button>
        <button class="tab" type="button" data-page="calendar">Calendari</button>
      </nav>
    </header>

    <section class="page active" id="homePage">
      <article class="next-event">
        <div class="label">El teu pròxim esdeveniment és:</div>
        <h2 id="nextTitle">Encara no tens esdeveniments</h2>
        <p id="nextInfo">Afegeix una activitat al calendari per veure-la aquí.</p>
      </article>

      <section class="summary-grid" aria-label="Resum">
        <div class="summary-box">
          <strong id="totalEvents">0</strong>
          <span>esdeveniments guardats</span>
        </div>
        <div class="summary-box">
          <strong id="saturdayEvents">0</strong>
          <span>plans dissabte</span>
        </div>
        <div class="summary-box">
          <strong id="sundayEvents">0</strong>
          <span>plans diumenge</span>
        </div>
      </section>

      <section class="panel">
        <h2>Afegir activitat</h2>
        <form class="form-grid" id="activityForm">
          <label>
            Activitat
            <input id="activityName" type="text" placeholder="Ex. Dinar fora" required>
          </label>

          <label>
            Dia
            <select id="activityDay" required>
              <option value="Dissabte">Dissabte</option>
              <option value="Diumenge">Diumenge</option>
            </select>
          </label>

          <label>
            Hora
            <input id="activityTime" type="time" required>
          </label>

          <label>
            Lloc
            <input id="activityPlace" type="text" placeholder="Ex. Centre comercial" required>
          </label>

          <label class="full">
            Persones
            <input id="activityPeople" type="text" placeholder="Ex. Anna, Carles, família" required>
          </label>

          <div class="full">
            <button class="primary-button" type="submit">Guardar activitat</button>
          </div>
        </form>
      </section>
    </section>

    <section class="page" id="calendarPage">
      <section class="calendar-grid" aria-label="Calendari del cap de setmana">
        <article class="day-column">
          <h2>Dissabte <span class="count" id="saturdayCount">0</span></h2>
          <div class="event-list" id="saturdayList"></div>
        </article>

        <article class="day-column">
          <h2>Diumenge <span class="count" id="sundayCount">0</span></h2>
          <div class="event-list" id="sundayList"></div>
        </article>
      </section>
    </section>
  </main>

  <script>
    const storageKey = "weekendPlannerEvents";
    const tabs = document.querySelectorAll(".tab");
    const pages = {
      home: document.getElementById("homePage"),
      calendar: document.getElementById("calendarPage")
    };

    const form = document.getElementById("activityForm");
    const activityName = document.getElementById("activityName");
    const activityDay = document.getElementById("activityDay");
    const activityTime = document.getElementById("activityTime");
    const activityPlace = document.getElementById("activityPlace");
    const activityPeople = document.getElementById("activityPeople");

    const nextTitle = document.getElementById("nextTitle");
    const nextInfo = document.getElementById("nextInfo");
    const totalEvents = document.getElementById("totalEvents");
    const saturdayEvents = document.getElementById("saturdayEvents");
    const sundayEvents = document.getElementById("sundayEvents");
    const saturdayCount = document.getElementById("saturdayCount");
    const sundayCount = document.getElementById("sundayCount");
    const saturdayList = document.getElementById("saturdayList");
    const sundayList = document.getElementById("sundayList");

    let events = normalizeEvents(loadEvents());
    saveEvents();

    function loadEvents() {
      const saved = localStorage.getItem(storageKey);
      if (!saved) {
        return [
          {
            id: crypto.randomUUID(),
            name: "Passeig pel parc",
            day: "Dissabte",
            time: "11:00",
            place: "Parc central",
            people: "Laura"
          },
          {
            id: crypto.randomUUID(),
            name: "Sopar tranquil",
            day: "Diumenge",
            time: "20:30",
            place: "Casa",
            people: "Família"
          }
        ];
      }

      return JSON.parse(saved);
    }

    function normalizeEvents(eventList) {
      return eventList.map((event) => ({
        ...event,
        day: event.day === "Sabado" ? "Dissabte" : event.day === "Domingo" ? "Diumenge" : event.day
      }));
    }

    function saveEvents() {
      localStorage.setItem(storageKey, JSON.stringify(events));
    }

    function switchPage(pageName) {
      tabs.forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.page === pageName);
      });

      Object.entries(pages).forEach(([name, page]) => {
        page.classList.toggle("active", name === pageName);
      });
    }

    function dayOrder(day) {
      return day === "Dissabte" ? 1 : 2;
    }

    function sortedEvents() {
      return [...events].sort((a, b) => {
        if (dayOrder(a.day) !== dayOrder(b.day)) {
          return dayOrder(a.day) - dayOrder(b.day);
        }

        return a.time.localeCompare(b.time);
      });
    }

    function formatEventLine(event) {
      return `${event.day} a les ${event.time} · ${event.place} · amb ${event.people}`;
    }

    function renderNextEvent() {
      const next = sortedEvents()[0];

      if (!next) {
        nextTitle.textContent = "Encara no tens esdeveniments";
        nextInfo.textContent = "Afegeix una activitat al calendari per veure-la aquí.";
        return;
      }

      nextTitle.textContent = next.name;
      nextInfo.textContent = formatEventLine(next);
    }

    function renderSummary() {
      const saturday = events.filter((event) => event.day === "Dissabte").length;
      const sunday = events.filter((event) => event.day === "Diumenge").length;

      totalEvents.textContent = events.length;
      saturdayEvents.textContent = saturday;
      sundayEvents.textContent = sunday;
      saturdayCount.textContent = saturday;
      sundayCount.textContent = sunday;
    }

    function createEventCard(event) {
      const card = document.createElement("article");
      card.className = "event-card";

      card.innerHTML = `
        <div class="event-top">
          <div class="event-title"></div>
          <div class="event-time"></div>
        </div>
        <div class="event-detail"></div>
        <button class="delete-button" type="button">Eliminar</button>
      `;

      card.querySelector(".event-title").textContent = event.name;
      card.querySelector(".event-time").textContent = event.time;
      card.querySelector(".event-detail").textContent = `${event.place} · amb ${event.people}`;
      card.querySelector(".delete-button").addEventListener("click", () => {
        events = events.filter((item) => item.id !== event.id);
        saveEvents();
        render();
      });

      return card;
    }

    function renderDayList(day, container) {
      const dayEvents = sortedEvents().filter((event) => event.day === day);
      container.innerHTML = "";

      if (dayEvents.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = `No tens activitats per al ${day.toLowerCase()}.`;
        container.appendChild(empty);
        return;
      }

      dayEvents.forEach((event) => {
        container.appendChild(createEventCard(event));
      });
    }

    function render() {
      renderNextEvent();
      renderSummary();
      renderDayList("Dissabte", saturdayList);
      renderDayList("Diumenge", sundayList);
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => switchPage(tab.dataset.page));
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      events.push({
        id: crypto.randomUUID(),
        name: activityName.value.trim(),
        day: activityDay.value,
        time: activityTime.value,
        place: activityPlace.value.trim(),
        people: activityPeople.value.trim()
      });

      saveEvents();
      form.reset();
      activityDay.value = "Dissabte";
      render();
      switchPage("calendar");
    });

    render();
  </script>
</body>
</html>
